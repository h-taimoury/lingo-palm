services:
  - type: web
    name: lingo-palm-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        # Render's generated value is 44 characters; Django requires >= 50.
        # Generate locally with secrets.token_urlsafe(64), then paste in Render.
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: https://lingo-palm-frontend.vercel.app
